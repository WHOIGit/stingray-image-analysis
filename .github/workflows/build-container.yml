name: Publish image-analysis container

on:
  # Rebuild the rolling image when its runtime implementation changes.
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-container.yml"
      - "docker/stingray-image-analysis/Dockerfile"
      - "frame_timestamps.sh"
      - "image_abundance.sh"
      - "build_class_map.py"
      - "merge_detections_parquet.py"

  # Allow an authorized maintainer to rebuild the pinned dependencies manually.
  workflow_dispatch:

concurrency:
  group: image-analysis-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Build from the exact image-analysis commit represented by the image tags.
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish a rolling tag, an immutable commit tag, and release tags.
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/stingray-image-analysis/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

